<!doctype html>
<html lang="sv" data-status="idle">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nästa tåg hem</title>
  <meta name="theme-color" content="#14171c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nästa tåg">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p id="route"></p>
    <button id="open-settings" type="button" aria-label="Inställningar">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <main>
    <section id="hero" aria-live="polite">
      <p id="verdict"></p>
      <p id="time"></p>
      <p id="train"></p>
      <p id="advice"></p>
      <button id="retry" type="button" hidden>Försök igen</button>
    </section>
    <p id="missed"></p>
    <ol id="later"></ol>
  </main>

  <footer>
    <label id="start-picker" hidden>Jag utgår från
      <select id="start-station"></select>
    </label>
    <p id="updated"></p>
    <p>Data: SL via Trafiklab · Karta © OpenStreetMap</p>
  </footer>

  <dialog id="settings" aria-labelledby="settings-title">
    <div class="nav">
      <h2 id="settings-title">Inställningar</h2>
      <button id="close-settings" type="button">Klar</button>
    </div>
    <form id="search-form" class="sheet">
      <h3>Hemadress</h3>
      <div class="group">
        <p id="saved-row" class="cell" hidden><span>Sparad</span><span id="saved-address"></span></p>
        <label class="cell search">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
          <input id="address" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" placeholder="Sök adress" aria-label="Sök adress">
        </label>
        <ul id="results"></ul>
        <button id="use-location" type="button" class="cell">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M21 3 3 10.5l7.2 2.3L12.5 20z"/></svg>
          Jag är hemma nu
        </button>
      </div>
      <p id="search-status" class="note" role="status"></p>
      <div id="home-choice" hidden>
        <h3>Hemstation</h3>
        <div class="group">
          <label class="cell picker"><span>Station</span>
            <select id="home-station"></select>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 9 5-5 5 5M7 15l5 5 5-5"/></svg>
          </label>
        </div>
        <p class="note">Tåget ska stanna här. Ändra om du brukar använda en annan station än den närmaste.</p>
      </div>
    </form>
  </dialog>

  <script type="module" src="src/app.js"></script>
</body>
</html>
